<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Terminal v4.0</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --green: #00ff9f;
    --green-dim: #00cc7f;
    --green-dark: #004d30;
    --cyan: #00e5ff;
    --amber: #ffb300;
    --red: #ff3d5a;
    --purple: #c77dff;
    --bg: #0a0e14;
    --bg-light: #111820;
    --glow: 0 0 10px rgba(0, 255, 159, 0.3), 0 0 40px rgba(0, 255, 159, 0.1);
    --glow-strong: 0 0 10px rgba(0, 255, 159, 0.5), 0 0 40px rgba(0, 255, 159, 0.2), 0 0 80px rgba(0, 255, 159, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Fira Code', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #matrix-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.06;
  }

  .terminal-wrapper {
    position: relative;
    z-index: 1;
    width: 95vw;
    max-width: 1200px;
    height: 90vh;
    border: 1px solid rgba(0, 255, 159, 0.2);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--glow-strong), inset 0 0 60px rgba(0, 255, 159, 0.03);
    background: linear-gradient(180deg, rgba(10, 14, 20, 0.98), rgba(6, 10, 16, 0.99));
  }

  .title-bar {
    background: linear-gradient(90deg, rgba(0, 255, 159, 0.1), rgba(0, 229, 255, 0.05));
    border-bottom: 1px solid rgba(0, 255, 159, 0.15);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
    -webkit-app-region: drag;
  }

  .title-bar .dots { display: flex; gap: 7px; }

  .title-bar .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .title-bar .dot:hover { transform: scale(1.2); }
  .title-bar .dot.red { background: #ff5f57; box-shadow: 0 0 6px rgba(255, 95, 87, 0.5); }
  .title-bar .dot.yellow { background: #ffbd2e; box-shadow: 0 0 6px rgba(255, 189, 46, 0.5); }
  .title-bar .dot.green { background: #28c840; box-shadow: 0 0 6px rgba(40, 200, 64, 0.5); }

  .title-bar .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--green-dim);
    text-transform: uppercase;
    flex: 1;
    text-align: center;
    text-shadow: 0 0 10px rgba(0, 255, 159, 0.3);
  }

  .title-bar .status {
    font-size: 10px;
    color: var(--green-dark);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .title-bar .status .pulse {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--green);
  }

  .title-bar .edit-indicator {
    font-size: 10px;
    color: var(--purple);
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(199, 125, 255, 0.5);
    display: none;
  }

  .title-bar .edit-indicator.active { display: inline; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .terminal-body {
    height: calc(100% - 42px);
    overflow-y: auto;
    padding: 20px;
    position: relative;
    scroll-behavior: smooth;
  }

  .terminal-body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 255, 159, 0.015) 2px,
      rgba(0, 255, 159, 0.015) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .terminal-body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 255, 159, 0.01);
    pointer-events: none;
    z-index: 99;
    animation: flicker 0.15s infinite;
  }

  @keyframes flicker {
    0% { opacity: 0.27; }
    5% { opacity: 0.34; }
    10% { opacity: 0.28; }
    20% { opacity: 0.35; }
    40% { opacity: 0.29; }
    50% { opacity: 0.33; }
    60% { opacity: 0.27; }
    80% { opacity: 0.31; }
    100% { opacity: 0.27; }
  }

  .terminal-body::-webkit-scrollbar { width: 6px; }
  .terminal-body::-webkit-scrollbar-track { background: transparent; }
  .terminal-body::-webkit-scrollbar-thumb {
    background: rgba(0, 255, 159, 0.2);
    border-radius: 3px;
  }
  .terminal-body::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 255, 159, 0.4);
  }

  .output-line {
    margin-bottom: 2px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .output-line.command { color: var(--green); }
  .output-line.result { color: rgba(0, 255, 159, 0.7); }
  .output-line.error { color: var(--red); text-shadow: 0 0 8px rgba(255, 61, 90, 0.3); }
  .output-line.info { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 229, 255, 0.2); }
  .output-line.warning { color: var(--amber); text-shadow: 0 0 8px rgba(255, 179, 0, 0.2); }
  .output-line.system { color: var(--purple); text-shadow: 0 0 8px rgba(199, 125, 255, 0.2); }
  .output-line.ascii { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 159, 0.4); line-height: 1.2; }
  .output-line.dim { color: var(--green-dark); }
  .output-line.ai { color: var(--purple); text-shadow: 0 0 8px rgba(199, 125, 255, 0.3); }
  .output-line.git { color: var(--amber); text-shadow: 0 0 8px rgba(255, 179, 0, 0.2); }

  .input-line {
    display: flex;
    align-items: center;
    margin-top: 2px;
    line-height: 1.6;
    font-size: 14px;
  }

  .prompt {
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    white-space: nowrap;
    margin-right: 8px;
    font-weight: 500;
  }

  .prompt .user { color: var(--amber); text-shadow: 0 0 8px rgba(255, 179, 0, 0.3); }
  .prompt .at { color: var(--green-dark); }
  .prompt .host { color: var(--cyan); }
  .prompt .colon { color: var(--green-dark); }
  .prompt .path { color: var(--green); font-weight: 600; }
  .prompt .symbol { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 159, 0.4); }
  .prompt .git-branch { color: var(--purple); font-size: 12px; margin-right: 4px; }

  #command-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    caret-color: var(--green);
    text-shadow: 0 0 5px rgba(0, 255, 159, 0.3);
  }

  #command-input::selection {
    background: rgba(0, 255, 159, 0.2);
  }

  #boot-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
  }

  #boot-screen .boot-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 20px rgba(0, 255, 159, 0.5), 0 0 60px rgba(0, 255, 159, 0.2);
    letter-spacing: 8px;
    margin-bottom: 30px;
    animation: logoGlow 2s ease-in-out infinite alternate;
  }

  @keyframes logoGlow {
    from { text-shadow: 0 0 20px rgba(0, 255, 159, 0.5), 0 0 60px rgba(0, 255, 159, 0.2); }
    to { text-shadow: 0 0 30px rgba(0, 255, 159, 0.7), 0 0 80px rgba(0, 255, 159, 0.3), 0 0 120px rgba(0, 255, 159, 0.1); }
  }

  #boot-screen .boot-text {
    font-size: 13px;
    color: var(--green-dim);
    text-align: left;
    width: 100%;
    max-width: 600px;
    line-height: 1.8;
  }

  #boot-screen .boot-text .line {
    opacity: 0;
    transform: translateY(5px);
    transition: all 0.3s ease;
  }

  #boot-screen .boot-text .line.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #boot-screen .progress-bar {
    width: 100%;
    max-width: 600px;
    height: 2px;
    background: var(--green-dark);
    margin-top: 20px;
    border-radius: 1px;
    overflow: hidden;
  }

  #boot-screen .progress-bar .fill {
    height: 100%;
    width: 0%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    transition: width 0.3s ease;
  }

  .autocomplete {
    position: absolute;
    background: rgba(10, 14, 20, 0.95);
    border: 1px solid rgba(0, 255, 159, 0.2);
    border-radius: 6px;
    padding: 4px 0;
    min-width: 200px;
    z-index: 200;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), var(--glow);
    display: none;
  }

  .autocomplete .item {
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--green-dim);
    transition: all 0.15s;
  }

  .autocomplete .item:hover,
  .autocomplete .item.selected {
    background: rgba(0, 255, 159, 0.1);
    color: var(--green);
  }

  .autocomplete .item .cmd-name { font-weight: 600; }
  .autocomplete .item .cmd-desc {
    color: var(--green-dark);
    margin-left: 12px;
    font-size: 11px;
  }

  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
  }

  .glitch { animation: glitch 0.3s ease; }

  .table-output {
    border-collapse: collapse;
    margin: 8px 0;
  }

  .table-output th {
    color: var(--cyan);
    text-align: left;
    padding: 4px 16px 4px 0;
    border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    font-weight: 600;
    font-size: 13px;
  }

  .table-output td {
    padding: 3px 16px 3px 0;
    color: rgba(0, 255, 159, 0.7);
    font-size: 13px;
  }

  .inline-progress {
    display: inline-block;
    width: 200px;
    height: 8px;
    background: var(--green-dark);
    border-radius: 4px;
    overflow: hidden;
    vertical-align: middle;
  }

  .inline-progress .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--cyan));
    border-radius: 4px;
    box-shadow: 0 0 8px rgba(0, 255, 159, 0.4);
    transition: width 0.5s ease;
  }
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div class="terminal-wrapper">
  <div class="title-bar">
    <div class="dots">
      <div class="dot red" title="关闭"></div>
      <div class="dot yellow" title="最小化"></div>
      <div class="dot green" title="最大化"></div>
    </div>
    <div class="title">NEXUS Terminal v4.0</div>
    <span class="edit-indicator" id="edit-indicator">EDIT</span>
    <div class="status">
      <div class="pulse"></div>
      <span>SECURE</span>
    </div>
  </div>

  <div class="terminal-body" id="terminal">
    <div id="boot-screen">
      <div class="boot-logo">NEXUS</div>
      <div class="boot-text" id="boot-text"></div>
      <div class="progress-bar"><div class="fill" id="boot-progress"></div></div>
    </div>
  </div>
</div>

<div class="autocomplete" id="autocomplete"></div>

<script>
// ═══════════════════════════════════════════
// NEXUS Terminal v4.0 - 高级模拟命令行工具
// ═══════════════════════════════════════════

const terminal = document.getElementById('terminal');
const bootScreen = document.getElementById('boot-screen');
const bootText = document.getElementById('boot-text');
const bootProgress = document.getElementById('boot-progress');
const autocomplete = document.getElementById('autocomplete');
const editIndicator = document.getElementById('edit-indicator');

let commandHistory = [];
let historyIndex = -1;
let currentDir = '~';
let inputEl = null;
let isBooted = false;

// 编辑器模式
let editMode = false;
let editFile = '';
let editLines = [];
let editLineNum = 0;

// 管道捕获
let captureBuffer = null;

// AI 对话历史
let aiConversationHistory = [];

// 别名系统
let aliases = {};

// Git 状态
let gitState = {
  initialized: false,
  staged: [],
  commits: [],
  branch: 'main',
  branches: ['main']
};

let env = {
  USER: 'nexus',
  HOST: 'sys0',
  HOME: '~',
  SHELL: '/bin/nexus',
  LANG: 'zh_CN.UTF-8',
  TERM: 'xterm-256color',
  PATH: '/usr/local/bin:/usr/bin:/bin',
  EDITOR: 'vim',
  PS1: '\\u@\\h:\\w$ '
};

// 文件系统（默认初始值）
const defaultFileSystem = {
  '~': {
    type: 'dir',
    children: {
      'documents': {
        type: 'dir',
        children: {
          'notes.txt': { type: 'file', content: '项目笔记：\n1. 完成 NEXUS Terminal 核心模块\n2. 优化 CRT 渲染效果\n3. 添加更多交互命令' },
          'todo.md': { type: 'file', content: '# TODO\n- [x] 基础命令系统\n- [x] 文件系统模拟\n- [ ] 网络模拟\n- [ ] 进程管理' },
          'report.csv': { type: 'file', content: '日期,项目,状态,进度\n2026-01-15,NEXUS,进行中,75%\n2026-02-01,CORE,已完成,100%\n2026-03-10,MESH,规划中,10%' }
        }
      },
      'projects': {
        type: 'dir',
        children: {
          'nexus': {
            type: 'dir',
            children: {
              'README.md': { type: 'file', content: '# NEXUS Terminal\n高级模拟终端系统 v4.0\n\n## 特性\n- CRT 视觉效果\n- 完整文件系统\n- 命令自动补全\n- 历史记录导航\n- AI 对话模拟\n- Git 版本控制\n- 管道与重定向' },
              'config.json': { type: 'file', content: '{\n  "theme": "cyberpunk",\n  "font": "Fira Code",\n  "glow": true,\n  "scanlines": true,\n  "fps": 60\n}' },
              'main.py': { type: 'file', content: 'import nexus.core as core\n\ndef main():\n    """NEXUS Terminal 主入口"""\n    terminal = core.Terminal()\n    terminal.boot()\n    terminal.run()\n\nif __name__ == "__main__":\n    main()' }
            }
          },
          'mesh': {
            type: 'dir',
            children: {
              'mesh.js': { type: 'file', content: '// Mesh Network Module\nclass MeshNode {\n  constructor(id, addr) {\n    this.id = id;\n    this.addr = addr;\n    this.peers = [];\n  }\n  connect(peer) {\n    this.peers.push(peer);\n  }\n}' }
            }
          }
        }
      },
      '.bashrc': { type: 'file', content: '# NEXUS Shell 配置\nexport PS1="\\u@\\h:\\w$ "\nexport EDITOR=vim\nalias ll="ls -la"\nalias cls="clear"' },
      '.gitconfig': { type: 'file', content: '[user]\n  name = Nexus User\n  email = nexus@sys0.local\n[core]\n  editor = vim\n[color]\n  ui = auto' }
    }
  }
};

let fileSystem = JSON.parse(JSON.stringify(defaultFileSystem));

// ═══════════════════════════════════════════
// localStorage 持久化
// ═══════════════════════════════════════════

const STORAGE_KEY = 'nexus_terminal_state';

function saveState() {
  try {
    const state = {
      fileSystem: fileSystem,
      commandHistory: commandHistory,
      env: env,
      aliases: aliases,
      gitState: gitState,
      currentDir: currentDir
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // localStorage 可能不可用或已满
  }
}

function loadState() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      const state = JSON.parse(data);
      if (state.fileSystem) fileSystem = state.fileSystem;
      if (state.commandHistory) commandHistory = state.commandHistory;
      if (state.env) env = { ...env, ...state.env };
      if (state.aliases) aliases = state.aliases;
      if (state.gitState) gitState = { ...gitState, ...state.gitState };
      if (state.currentDir) currentDir = state.currentDir;
      historyIndex = commandHistory.length;
      return true;
    }
  } catch (e) {
    // 解析失败
  }
  return false;
}

function clearState() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}

// ═══════════════════════════════════════════
// 启动序列
// ═══════════════════════════════════════════

const bootSequence = [
  { text: '[BIOS] POST 检查通过...', delay: 200 },
  { text: '[BIOS] 内存检测: 32768 MB OK', delay: 300 },
  { text: '[KERNEL] 加载 NEXUS Kernel 6.1.0-nexus...', delay: 400 },
  { text: '[KERNEL] 初始化 CPU 调度器...', delay: 200 },
  { text: '[KERNEL] 挂载根文件系统...', delay: 300 },
  { text: '[NET] 启动网络接口 eth0...', delay: 250 },
  { text: '[NET] IP 地址: 10.0.13.37/24', delay: 200 },
  { text: '[SEC] 加载安全模块 [AES-256]...', delay: 300 },
  { text: '[SEC] 防火墙规则已应用 (42 条)', delay: 200 },
  { text: '[SYS] 启动系统服务...', delay: 400 },
  { text: '[SYS]   ✓ cron     ✓ dbus     ✓ network', delay: 300 },
  { text: '[SYS]   ✓ sshd     ✓ syslog   ✓ nginx', delay: 250 },
  { text: '[NEXUS] 终端服务就绪', delay: 300 },
  { text: '', delay: 200 },
  { text: '>>> 系统启动完成 <<<', delay: 0 }
];

async function boot() {
  // 尝试从 localStorage 恢复状态
  let restored = false;
  try {
    restored = loadState();
  } catch (e) {
    console.warn('loadState 失败:', e);
  }

  try {
    for (let i = 0; i < bootSequence.length; i++) {
      const step = bootSequence[i];
      const line = document.createElement('div');
      line.className = 'line';
      if (step.text.includes('✓')) {
        line.style.color = 'var(--green-dim)';
      } else if (step.text.includes('>>>')) {
        line.style.color = 'var(--cyan)';
        line.style.fontWeight = '600';
        line.style.textShadow = '0 0 10px rgba(0, 229, 255, 0.4)';
      } else if (step.text.includes('[SEC]')) {
        line.style.color = 'var(--amber)';
      }
      line.textContent = step.text;
      bootText.appendChild(line);

      await sleep(50);
      line.classList.add('visible');
      bootProgress.style.width = `${((i + 1) / bootSequence.length) * 100}%`;

      if (step.delay) await sleep(step.delay);
    }

    await sleep(600);
    bootScreen.style.transition = 'opacity 0.5s ease';
    bootScreen.style.opacity = '0';
    await sleep(500);
    bootScreen.remove();
  } catch (e) {
    // 启动动画出错时强制移除 boot-screen
    console.warn('boot 动画异常:', e);
    const bs = document.getElementById('boot-screen');
    if (bs) bs.remove();
  }

  isBooted = true;

  try {
    showWelcome();
    if (restored) {
      addOutput('  [已从本地存储恢复会话状态]', 'system');
      addOutput('');
    }
  } catch (e) {
    console.warn('showWelcome 异常:', e);
  }

  // 确保 createInputLine 始终被调用
  try {
    createInputLine();
  } catch (e) {
    console.warn('createInputLine 异常:', e);
    // 终极兜底：强制创建最小可用输入行
    try {
      terminal.innerHTML += '<div class="input-line"><span class="prompt"><span class="user">nexus</span><span class="at">@</span><span class="host">terminal</span><span class="colon">:</span><span class="path">~</span><span class="symbol">$ </span></span><input id="command-input" type="text" autocomplete="off" spellcheck="false"></div>';
      inputEl = document.getElementById('command-input');
      if (inputEl) {
        inputEl.addEventListener('keydown', handleKeyDown);
        inputEl.addEventListener('input', handleInput);
        inputEl.focus();
      }
    } catch (e2) {
      console.error('兜底输入行创建失败:', e2);
    }
  }

  // 安全网：延迟检查输入行是否存在
  setTimeout(() => {
    if (!inputEl || !document.getElementById('command-input')) {
      console.warn('输入行丢失，重新创建');
      createInputLine();
    }
  }, 200);
}

function showWelcome() {
  const ascii = `
  ███╗   ██╗███████╗██╗  ██╗██╗   ██╗███████╗
  ████╗  ██║██╔════╝╚██╗██╔╝██║   ██║██╔════╝
  ██╔██╗ ██║█████╗   ╚███╔╝ ██║   ██║███████╗
  ██║╚██╗██║██╔══╝   ██╔██╗ ██║   ██║╚════██║
  ██║ ╚████║███████╗██╔╝ ╚██╗╚██████╔╝███████║
  ╚═╝  ╚═══╝╚══════╝╚═╝   ╚═╝ ╚═════╝ ╚══════╝`;

  addOutput(ascii, 'ascii');
  addOutput('');

function addOutput(text, type = 'result') {
  // 管道捕获模式
  if (captureBuffer !== null) {
    captureBuffer.push(text);
    return;
  }
  const line = document.createElement('div');
  line.className = `output-line ${type}`;
  line.textContent = text;
  terminal.appendChild(line);
  scrollToBottom();
}

function addOutputHTML(html, type = 'result') {
  if (captureBuffer !== null) {
    // 捕获模式下提取纯文本
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    captureBuffer.push(tmp.textContent || tmp.innerText);
    return;
  }
  const line = document.createElement('div');
  line.className = `output-line ${type}`;
  line.innerHTML = html;
  terminal.appendChild(line);
  scrollToBottom();
}

function scrollToBottom() {
  terminal.scrollTop = terminal.scrollHeight;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function createInputLine() {
  // 移除可能残留的旧输入框（防止 id 重复）
  const oldInput = document.getElementById('command-input');
  if (oldInput) oldInput.removeAttribute('id');

  const line = document.createElement('div');
  line.className = 'input-line';

  const prompt = document.createElement('span');
  prompt.className = 'prompt';

  let gitBranch = '';
  if (gitState.initialized) {
    gitBranch = `<span class="git-branch"> (${gitState.branch})</span>`;
  }

  prompt.innerHTML = `<span class="user">${env.USER}</span><span class="at">@</span><span class="host">${env.HOST}</span><span class="colon">:</span><span class="path">${currentDir}</span>${gitBranch}<span class="symbol">$ </span>`;

  const input = document.createElement('input');
  input.id = 'command-input';
  input.type = 'text';
  input.autocomplete = 'off';
  input.spellcheck = false;

  line.appendChild(prompt);
  line.appendChild(input);
  terminal.appendChild(line);

  inputEl = input;

  // 使用 requestAnimationFrame 确保浏览器完成布局后再聚焦
  requestAnimationFrame(() => {
    input.focus();
    scrollToBottom();
  });

  input.addEventListener('keydown', handleKeyDown);
  input.addEventListener('input', handleInput);
}

async function handleKeyDown(e) {
  // 编辑器模式
  if (editMode) {
    handleEditKeyDown(e);
    return;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    const cmd = inputEl.value;
    hideAutocomplete();

    const inputLine = inputEl.closest('.input-line');
    const promptHTML = inputLine.querySelector('.prompt').innerHTML;
    inputLine.innerHTML = `<span class="prompt">${promptHTML}</span><span style="color: var(--green); text-shadow: 0 0 5px rgba(0,255,159,0.3);">${escapeHTML(cmd)}</span>`;
    inputLine.className = 'output-line command';

    if (cmd.trim()) {
      commandHistory.push(cmd);
      historyIndex = commandHistory.length;
      inputEl = null; // 防止异步命令期间 inputEl 引用混乱
      try {
        await processCommand(cmd.trim());
      } catch (e) {
        addOutput('命令执行错误: ' + (e.message || e), 'error');
      }
      saveState();
    }

    // 仅在输入行不存在时创建（reboot/clear 等命令可能已内部创建）
    if (!document.getElementById('command-input')) {
      createInputLine();
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      inputEl.value = commandHistory[historyIndex];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      inputEl.value = commandHistory[historyIndex];
    } else {
      historyIndex = commandHistory.length;
      inputEl.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    handleTabComplete();
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    clearTerminal();
  } else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    const inputLine = inputEl.closest('.input-line');
    const promptHTML = inputLine.querySelector('.prompt').innerHTML;
    inputLine.innerHTML = `<span class="prompt">${promptHTML}</span><span style="color: var(--green);">${escapeHTML(inputEl.value)}</span><span style="color: var(--red);">^C</span>`;
    inputLine.className = 'output-line command';
    createInputLine();
  }
}

function handleInput() {
  if (editMode) return;
  if (inputEl.value.length > 0) {
    showAutocomplete(inputEl.value);
  } else {
    hideAutocomplete();
  }
}

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function enterEditMode(fileName) {
  const file = getFile(fileName);
  editFile = fileName;
  if (file && file.type === 'file') {
    editLines = file.content ? file.content.split('\n') : [''];
  } else {
    editLines = [''];
  }
  editLineNum = 0;
  editMode = true;
  editIndicator.classList.add('active');

  addOutput(`[编辑器] 正在编辑: ${fileName}`, 'system');
  addOutput('[编辑器] 逐行输入内容，输入 :wq 保存退出，:q 放弃退出', 'system');
  addOutput('');

  renderEditPrompt();
}

function renderEditPrompt() {
  const line = document.createElement('div');
  line.className = 'input-line';

  const prompt = document.createElement('span');
  prompt.className = 'prompt';
  prompt.innerHTML = `<span style="color:var(--purple)">${String(editLineNum + 1).padStart(3)} |</span> `;

  const input = document.createElement('input');
  input.id = 'command-input';
  input.type = 'text';
  input.autocomplete = 'off';
  input.spellcheck = false;
  if (editLines[editLineNum] !== undefined) {
    input.value = editLines[editLineNum];
  }

  line.appendChild(prompt);
  line.appendChild(input);
  terminal.appendChild(line);

  inputEl = input;
  input.focus();
  input.addEventListener('keydown', handleKeyDown);
}

function handleEditKeyDown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = inputEl.value;

    // 检查退出命令
    if (val.trim() === ':wq') {
      // 保存并退出
      const inputLine = inputEl.closest('.input-line');
      inputLine.innerHTML = `<span style="color:var(--purple)">  ${String(editLineNum + 1).padStart(3)} |</span> <span style="color:var(--cyan)">:wq</span>`;
      inputLine.className = 'output-line';

      // 写入文件
      const dir = resolveDir(currentDir);
      if (dir.children[editFile]) {
        dir.children[editFile].content = editLines.join('\n');
      } else {
        dir.children[editFile] = { type: 'file', content: editLines.join('\n') };
      }
      addOutput(`[编辑器] 已保存: ${editFile} (${editLines.length} 行)`, 'system');
      editMode = false;
      editIndicator.classList.remove('active');
      saveState();
      createInputLine();
      return;
    }

    if (val.trim() === ':q') {
      // 放弃退出
      const inputLine = inputEl.closest('.input-line');
      inputLine.innerHTML = `<span style="color:var(--purple)">  ${String(editLineNum + 1).padStart(3)} |</span> <span style="color:var(--red)">:q</span>`;
      inputLine.className = 'output-line';

      addOutput('[编辑器] 已放弃修改', 'warning');
      editMode = false;
      editIndicator.classList.remove('active');
      createInputLine();
      return;
    }

    // 记录当前行
    editLines[editLineNum] = val;
    editLineNum++;

    // 确保数组足够长
    while (editLines.length <= editLineNum) {
      editLines.push('');
    }

    // 将当前输入行变为静态
    const inputLine = inputEl.closest('.input-line');
    inputLine.innerHTML = `<span style="color:var(--purple)">${String(editLineNum).padStart(3)} |</span> <span style="color:var(--green-dim)">${escapeHTML(val)}</span>`;
    inputLine.className = 'output-line';

    renderEditPrompt();
  }
}

function showAutocomplete(partial) {
  const parts = partial.split(' ');
  const cmdPart = parts[0].toLowerCase();
  const matches = Object.keys(commands).filter(c => c.startsWith(cmdPart));

  if (matches.length === 0 || (parts.length > 1)) {
    hideAutocomplete();
    return;
  }

  autocomplete.innerHTML = '';
  matches.forEach((cmd, i) => {
    const item = document.createElement('div');
    item.className = 'item' + (i === 0 ? ' selected' : '');
    item.innerHTML = `<span class="cmd-name">${cmd}</span><span class="cmd-desc">${commands[cmd]}</span>`;
    item.addEventListener('click', () => {
      inputEl.value = cmd + ' ';
      hideAutocomplete();
      inputEl.focus();
    });
    autocomplete.appendChild(item);
  });

  const inputRect = inputEl.getBoundingClientRect();
  autocomplete.style.left = inputRect.left + 'px';
  autocomplete.style.top = (inputRect.bottom + 4) + 'px';
  autocomplete.style.display = 'block';
}

function hideAutocomplete() {
  autocomplete.style.display = 'none';
}

function handleTabComplete() {
  const partial = inputEl.value.split(' ');
  const cmdPart = partial[0].toLowerCase();

  if (partial.length === 1) {
    const matches = Object.keys(commands).filter(c => c.startsWith(cmdPart));
    if (matches.length === 1) {
      inputEl.value = matches[0] + ' ';
      hideAutocomplete();
    } else if (matches.length > 1) {
      addOutput(matches.join('  '), 'dim');
    }
  } else if (partial.length === 2 && ['cd', 'ls', 'cat', 'rm', 'tree', 'edit', 'head', 'tail', 'grep', 'wc', 'chmod', 'diff'].includes(cmdPart)) {
    const dir = resolveDir(currentDir);
    if (dir && dir.children) {
      const filePart = partial[1].toLowerCase();
      const matches = Object.keys(dir.children).filter(c => c.startsWith(filePart));
      if (matches.length === 1) {
        inputEl.value = `${cmdPart} ${matches[0]}`;
        hideAutocomplete();
      } else if (matches.length > 1) {
        addOutput(matches.join('  '), 'dim');
      }
    }
  }
}

// 文件系统操作
// ═══════════════════════════════════════════

function resolveDir(path) {
  if (path === '~') return fileSystem['~'];
  const parts = path.replace('~/', '').replace('~', '').split('/').filter(Boolean);
  let current = fileSystem['~'];
  for (const part of parts) {
    if (current && current.children && current.children[part] && current.children[part].type === 'dir') {
      current = current.children[part];
    } else {
      return null;
    }
  }
  return current;
}

function resolvePath(path) {
  if (path.startsWith('~/')) path = path;
  else if (path.startsWith('/')) path = '~' + path;
  else if (path === '~') path = '~';
  else path = currentDir === '~' ? `~/${path}` : `${currentDir}/${path}`;

  const parts = path.split('/').filter(Boolean);
  const resolved = [];
  for (const part of parts) {
    if (part === '..') resolved.pop();
    else if (part !== '.') resolved.push(part);
  }
  return resolved.join('/') || '~';
}

function getFile(path) {
  const fullPath = resolvePath(path);
  const parts = fullPath.split('/').filter(Boolean);
  const fileName = parts.pop();
  const dirPath = parts.join('/') || '~';

  if (fileName === '' || fullPath === '~') return resolveDir('~');

  const dir = resolveDir(dirPath);
  if (dir && dir.children && dir.children[fileName]) {
    return dir.children[fileName];
  }
  return null;
}

function getParentDirAndName(path) {
  const fullPath = resolvePath(path);
  const parts = fullPath.split('/').filter(Boolean);
  const fileName = parts.pop();
  const dirPath = parts.join('/') || '~';
  const dir = resolveDir(dirPath);
  return { dir, fileName, dirPath };
}

// ═══════════════════════════════════════════
// 管道与重定向
// ═══════════════════════════════════════════

async function executeCaptured(cmdStr, stdin = '') {
  captureBuffer = [];
  try {
    await processCommandDirect(cmdStr, stdin);
  } catch (e) {
    captureBuffer.push('错误: ' + (e.message || e));
  }
  const output = captureBuffer.join('\n');
  captureBuffer = null;
  return output;
}

async function processCommand(input) {
  // 别名替换
  const firstWord = input.split(/\s+/)[0];
  if (aliases[firstWord]) {
    input = aliases[firstWord] + input.substring(firstWord.length);
  }

  // 检查管道（不能简单用 includes，因为引号内可能有 |）
  const pipeSegments = splitPipes(input);

  if (pipeSegments.length > 1) {
    let pipeData = '';
    for (const seg of pipeSegments) {
      pipeData = await executeCaptured(seg.trim(), pipeData);
    }
    addOutput(pipeData, 'result');
    return;
  }

  // 检查重定向
  let redirectFile = null;
  let appendMode = false;
  let commandPart = input;

  const appendIdx = findRedirect(input, '>>');
  const overwriteIdx = appendIdx === -1 ? findRedirect(input, '>') : -1;

  if (appendIdx !== -1) {
    commandPart = input.substring(0, appendIdx).trim();
    redirectFile = input.substring(appendIdx + 2).trim();
    appendMode = true;
  } else if (overwriteIdx !== -1) {
    commandPart = input.substring(0, overwriteIdx).trim();
    redirectFile = input.substring(overwriteIdx + 1).trim();
    appendMode = false;
  }

  if (redirectFile) {
    const output = await executeCaptured(commandPart);
    const { dir, fileName } = getParentDirAndName(redirectFile);
    if (!dir) {
      addOutput('重定向失败: 目录不存在', 'error');
      return;
    }
    if (appendMode && dir.children[fileName] && dir.children[fileName].type === 'file') {
      dir.children[fileName].content += '\n' + output;
    } else {
      dir.children[fileName] = { type: 'file', content: output };
    }
    saveState();
    return;
  }

  // 正常执行
  try {
    await processCommandDirect(input, '');
  } catch (e) {
    addOutput('命令执行错误: ' + (e.message || e), 'error');
  }
}

function splitPipes(input) {
  const segments = [];
  let current = '';
  let inQuote = false;
  let quoteChar = '';

  for (let i = 0; i < input.length; i++) {
    const ch = input[i];
    if (inQuote) {
      current += ch;
      if (ch === quoteChar) inQuote = false;
    } else if (ch === '"' || ch === "'") {
      inQuote = true;
      quoteChar = ch;
      current += ch;
    } else if (ch === '|') {
      segments.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  segments.push(current);
  return segments;
}

function findRedirect(input, op) {
  let inQuote = false;
  let quoteChar = '';
  for (let i = 0; i < input.length; i++) {
    const ch = input[i];
    if (inQuote) {
      if (ch === quoteChar) inQuote = false;
    } else if (ch === '"' || ch === "'") {
      inQuote = true;
      quoteChar = ch;
    } else if (input.substring(i, i + op.length) === op) {
      return i;
    }
  }
  return -1;
}

async function processCommandDirect(input, stdin = '') {
  const parts = input.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
  if (parts.length === 0) return;

  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1).map(a => a.replace(/^"|"$/g, ''));

  switch (cmd) {
    case 'help': cmdHelp(); break;
    case 'clear': clearTerminal(); break;
    case 'echo': cmdEcho(args, stdin); break;
    case 'date': addOutput(new Date().toLocaleString('zh-CN', { dateStyle: 'full', timeStyle: 'long' }), 'info'); break;
    case 'whoami': addOutput(env.USER, 'result'); break;
    case 'hostname': addOutput(env.HOST, 'result'); break;
    case 'pwd': addOutput(currentDir === '~' ? '/home/' + env.USER : currentDir.replace('~', '/home/' + env.USER), 'result'); break;
    case 'ls': cmdLs(args); break;
    case 'cd': cmdCd(args); break;
    case 'cat': cmdCat(args, stdin); break;
    case 'mkdir': cmdMkdir(args); break;
    case 'touch': cmdTouch(args); break;
    case 'rm': cmdRm(args); break;
    case 'tree': cmdTree(args); break;
    case 'env': cmdEnv(); break;
    case 'export': cmdExport(args); break;
    case 'history': cmdHistory(); break;
    case 'uname': cmdUname(args); break;
    case 'uptime': cmdUptime(); break;
    case 'ps': cmdPs(); break;
    case 'top': await cmdTop(); break;
    case 'ping': await cmdPing(args); break;
    case 'ifconfig': cmdIfconfig(); break;
    case 'curl': await cmdCurl(args); break;
    case 'ssh': await cmdSsh(args); break;
    case 'neofetch': cmdNeofetch(); break;
    case 'matrix': await cmdMatrix(); break;
    case 'weather': await cmdWeather(args); break;
    case 'calc': cmdCalc(args); break;
    case 'cowsay': cmdCowsay(args); break;
    case 'fortune': cmdFortune(); break;
    case 'color': cmdColor(args); break;
    case 'reboot': await cmdReboot(); break;
    case 'exit': cmdExit(); break;
    // 新增命令
    case 'ai': await cmdAi(args); break;
    case 'write': cmdWrite(args); break;
    case 'append': cmdAppend(args); break;
    case 'edit': cmdEdit(args); break;
    case 'grep': cmdGrep(args, stdin); break;
    case 'wc': cmdWc(args, stdin); break;
    case 'find': cmdFind(args); break;
    case 'alias': cmdAlias(args); break;
    case 'unalias': cmdUnalias(args); break;
    case 'head': cmdHead(args); break;
    case 'tail': cmdTail(args); break;
    case 'diff': cmdDiff(args); break;
    case 'chmod': cmdChmod(args); break;
    case 'man': cmdMan(args); break;
    case 'git': await cmdGit(args); break;
    case 'save': cmdSave(); break;
    case 'load': cmdLoad(); break;
    case 'reset': await cmdReset(args); break;
    default:
      addOutput(`nexus: 未找到命令: ${cmd}`, 'error');
      addOutput(`输入 'help' 查看可用命令列表`, 'dim');
  }
}

  cache.set(obj, clone);

  return clone;
}

async function typeOutput(text, type = 'ai') {
  const line = document.createElement('div');
  line.className = `output-line ${type}`;
  terminal.appendChild(line);

  const chars = text.split('');
  let buffer = '';
  const chunkSize = 3; // 每次输出3个字符，加快速度

  for (let i = 0; i < chars.length; i += chunkSize) {
    const chunk = chars.slice(i, i + chunkSize).join('');
    buffer += chunk;
    line.textContent = buffer;
    scrollToBottom();
    await sleep(15);
  }
}

function cmdGrep(args, stdin = '') {
  if (args.length < 1) {
    addOutput('用法: grep <pattern> [file]', 'error');
    return;
  }

  const pattern = args[0];
  let text = '';

  if (args[1]) {
    const file = getFile(args[1]);
    if (!file) {
      addOutput(`grep: ${args[1]}: 文件不存在`, 'error');
      return;
    }
    if (file.type === 'dir') {
      addOutput(`grep: ${args[1]}: 是一个目录`, 'error');
      return;
    }
    text = file.content || '';
  } else if (stdin) {
    text = stdin;
  } else {
    addOutput('grep: 缺少文件参数或管道输入', 'error');
    return;
  }

  const lines = text.split('\n');
  const regex = new RegExp(pattern, 'gi');
  let matchCount = 0;

  for (const line of lines) {
    if (regex.test(line)) {
      const highlighted = line.replace(new RegExp(pattern, 'gi'), match => `<span style="color:var(--red);font-weight:700">${escapeHTML(match)}</span>`);
      addOutputHTML(highlighted, 'result');
      matchCount++;
    }
  }

  if (matchCount === 0) {
    addOutput('(无匹配结果)', 'dim');
  }
}

  let fileName = '';

  if (args[0]) {
    const file = getFile(args[0]);
    if (!file) {
      addOutput(`wc: ${args[0]}: 文件不存在`, 'error');
      return;
    }
    if (file.type === 'dir') {
      addOutput(`wc: ${args[0]}: 是一个目录`, 'error');
      return;
    }
    text = file.content || '';
    fileName = args[0];
  } else if (stdin) {
    text = stdin;
  } else {
    addOutput('wc: 缺少文件参数或管道输入', 'error');
    return;
  }

  const lines = text.split('\n').length;
  const words = text.split(/\s+/).filter(Boolean).length;
  const chars = text.length;

  if (fileName) {
    addOutput(`  ${lines} ${words} ${chars} ${fileName}`, 'result');
  } else {
    addOutput(`  ${lines} 行  ${words} 字  ${chars} 字符`, 'result');
  }
}

function cmdFind(args) {
  if (!args[0]) {
    addOutput('用法: find <name>', 'error');
    return;
  }

  const searchName = args[0].toLowerCase();
  const results = [];

  function search(node, path) {
    if (!node || !node.children) return;
    for (const [name, entry] of Object.entries(node.children)) {
      const fullPath = path ? `${path}/${name}` : name;
      if (name.toLowerCase().includes(searchName)) {
        results.push({ name, path: fullPath, type: entry.type });
      }
      if (entry.type === 'dir') {
        search(entry, fullPath);
      }
    }
  }

  search(fileSystem['~'], '~');

  if (results.length === 0) {
    addOutput(`find: 未找到匹配 '${args[0]}' 的文件`, 'dim');
  } else {
    for (const r of results) {
      const typeIcon = r.type === 'dir' ? '📁' : '📄';
      addOutput(`  ${typeIcon} ${r.path}`, 'result');
    }
    addOutput(`共找到 ${results.length} 个结果`, 'dim');
  }
}

function cmdAlias(args) {
  if (args.length === 0) {
    if (Object.keys(aliases).length === 0) {
      addOutput('(无别名)', 'dim');
    } else {
      for (const [name, cmd] of Object.entries(aliases)) {
        addOutputHTML(`<span style="color:var(--cyan)">${name}</span>=<span style="color:var(--green-dim)">'${cmd}'</span>`, 'result');
      }
    }
    return;
  }

  const arg = args.join(' ');
  const eqIdx = arg.indexOf('=');
  if (eqIdx === -1) {
    addOutput('用法: alias <name>=<command>', 'error');
    return;
  }

  const name = arg.substring(0, eqIdx).trim();
  const cmd = arg.substring(eqIdx + 1).trim().replace(/^['"]|['"]$/g, '');

  if (!name || !cmd) {
    addOutput('alias: 名称和命令不能为空', 'error');
    return;
  }

  aliases[name] = cmd;
  addOutput(`别名已设置: ${name}='${cmd}'`, 'dim');
  saveState();
}

function cmdUnalias(args) {
  if (!args[0]) {
    addOutput('用法: unalias <name>', 'error');
    return;
  }

  if (aliases[args[0]]) {
    delete aliases[args[0]];
    addOutput(`别名 '${args[0]}' 已删除`, 'dim');
    saveState();
  } else {
    addOutput(`unalias: '${args[0]}' 不是别名`, 'error');
  }
}

function cmdHead(args) {
  if (!args[0]) {
    addOutput('用法: head <file> [n]', 'error');
    return;
  }

  const file = getFile(args[0]);
  if (!file) {
    addOutput(`head: ${args[0]}: 文件不存在`, 'error');
    return;
  }
  if (file.type === 'dir') {
    addOutput(`head: ${args[0]}: 是一个目录`, 'error');
    return;
  }

  const n = parseInt(args[1]) || 10;
  const lines = (file.content || '').split('\n').slice(0, n);
  for (const line of lines) {
    addOutput(line, 'result');
  }
}

function cmdTail(args) {
  if (!args[0]) {
    addOutput('用法: tail <file> [n]', 'error');
    return;
  }

  const file = getFile(args[0]);
  if (!file) {
    addOutput(`tail: ${args[0]}: 文件不存在`, 'error');
    return;
  }
  if (file.type === 'dir') {
    addOutput(`tail: ${args[0]}: 是一个目录`, 'error');
    return;
  }

  const n = parseInt(args[1]) || 10;
  const allLines = (file.content || '').split('\n');
  const lines = allLines.slice(-n);
  for (const line of lines) {
    addOutput(line, 'result');
  }
}

function cmdDiff(args) {
  if (args.length < 2) {
    addOutput('用法: diff <file1> <file2>', 'error');
    return;
  }

  const file1 = getFile(args[0]);
  const file2 = getFile(args[1]);

  if (!file1) {
    addOutput(`diff: ${args[0]}: 文件不存在`, 'error');
    return;
  }
  if (!file2) {
    addOutput(`diff: ${args[1]}: 文件不存在`, 'error');
    return;
  }
  if (file1.type === 'dir' || file2.type === 'dir') {
    addOutput('diff: 不支持目录比较', 'error');
    return;
  }

  const lines1 = (file1.content || '').split('\n');
  const lines2 = (file2.content || '').split('\n');
  const maxLen = Math.max(lines1.length, lines2.length);

  let hasDiff = false;
  for (let i = 0; i < maxLen; i++) {
    const l1 = lines1[i] !== undefined ? lines1[i] : '';
    const l2 = lines2[i] !== undefined ? lines2[i] : '';

    if (l1 !== l2) {
      hasDiff = true;
      addOutput(`@@ 第 ${i + 1} 行 @@`, 'info');
      if (l1 !== '') addOutput(`- ${l1}`, 'error');
      if (l2 !== '') addOutput(`+ ${l2}`, 'ai');
    }
  }

  if (!hasDiff) {
    addOutput('两个文件内容相同', 'dim');
  }
}

function cmdChmod(args) {
  if (args.length < 2) {
    addOutput('用法: chmod <mode> <file>', 'error');
    return;
  }

  const file = getFile(args[1]);
  if (!file) {
    addOutput(`chmod: ${args[1]}: 文件不存在`, 'error');
    return;
  }

  const mode = args[0];
  if (!/^[0-7]{3}$/.test(mode) && !/^[rwx-]{9}$/.test(mode)) {
    addOutput(`chmod: 无效权限模式: ${mode}`, 'error');
    return;
  }

  // 模拟修改权限（实际文件系统不存储权限，仅模拟输出）
  addOutput(`${args[1]} 的权限已修改为 ${mode}`, 'dim');
}

async function cmdGit(args) {
  if (args.length === 0) {
    addOutput('用法: git <subcommand> [args]', 'error');
    addOutput('子命令: init, add, commit, status, log, diff, branch, checkout', 'dim');
    return;
  }

  const subcmd = args[0];

  switch (subcmd) {
    case 'init':
      gitInit(); break;
    case 'add':
      gitAdd(args.slice(1)); break;
    case 'commit':
      await gitCommit(args.slice(1)); break;
    case 'status':
      gitStatus(); break;
    case 'log':
      gitLog(); break;
    case 'diff':
      gitDiff(args.slice(1)); break;
    case 'branch':
      gitBranch(args.slice(1)); break;
    case 'checkout':
      gitCheckout(args.slice(1)); break;
    default:
      addOutput(`git: '${subcmd}' 不是 git 命令`, 'error');
  }
}

function gitInit() {
  if (gitState.initialized) {
    addOutput('已重新初始化现有 Git 仓库', 'git');
    return;
  }
  gitState.initialized = true;
  gitState.staged = [];
  gitState.commits = [];
  gitState.branch = 'main';
  gitState.branches = ['main'];
  addOutput(`已初始化 Git 仓库于 /home/${env.USER}/${currentDir}/.git/`, 'git');
  addOutput('', 'git');
  addOutput('提示: 使用 git add <file> 添加文件到暂存区', 'dim');
  saveState();
}

function gitAdd(args) {
  if (!gitState.initialized) {
    addOutput('fatal: 不是 Git 仓库（未找到 .git 目录）', 'error');
    return;
  }

  if (args.length === 0) {
    addOutput('Nothing specified, nothing added.', 'dim');
    return;
  }

  if (args[0] === '.') {
    // 添加所有文件
    const dir = resolveDir(currentDir);
    if (dir && dir.children) {
      for (const name of Object.keys(dir.children)) {
        if (!name.startsWith('.') && dir.children[name].type === 'file') {
          if (!gitState.staged.includes(name)) {
            gitState.staged.push(name);
          }
        }
      }
    }
    addOutput('已添加所有文件到暂存区', 'git');
  } else {
    for (const file of args) {
      const f = getFile(file);
      if (!f) {
        addOutput(`fatal: 路径 '${file}' 未匹配任何文件`, 'error');
        continue;
      }
      if (f.type === 'dir') {
        addOutput(`fatal: '${file}' 是目录 - 不添加目录`, 'error');
        continue;
      }
      if (!gitState.staged.includes(file)) {
        gitState.staged.push(file);
      }
    }
    addOutput(`已暂存 ${args.length} 个文件`, 'git');
  }
  saveState();
}

async function gitCommit(args) {
  if (!gitState.initialized) {
    addOutput('fatal: 不是 Git 仓库', 'error');
    return;
  }

  if (gitState.staged.length === 0) {
    addOutput('nothing to commit, working tree clean', 'dim');
    return;
  }

  let message = '';
  if (args.length >= 2 && args[0] === '-m') {
    message = args.slice(1).join(' ').replace(/^"|"$/g, '');
  } else if (args.length >= 1) {
    message = args.join(' ').replace(/^"|"$/g, '');
  }

  if (!message) {
    addOutput('error: 必须提供提交信息 (-m "message")', 'error');
    return;
  }

  const commit = {
    hash: Math.random().toString(16).substring(2, 9),
    message: message,
    author: env.USER,
    date: new Date().toLocaleString('zh-CN'),
    branch: gitState.branch,
    files: [...gitState.staged]
  };

  gitState.commits.push(commit);
  addOutput(`[${gitState.branch} ${commit.hash}] ${message}`, 'git');
  addOutput(` ${gitState.staged.length} file(s) changed`, 'result');
  gitState.staged = [];
  saveState();
}

function gitStatus() {
  if (!gitState.initialized) {
    addOutput('fatal: 不是 Git 仓库', 'error');
    return;
  }

  addOutput(`位于分支 ${gitState.branch}`, 'git');

  const dir = resolveDir(currentDir);
  const allFiles = dir && dir.children ? Object.keys(dir.children).filter(n => !n.startsWith('.')) : [];
  const unstaged = allFiles.filter(f => !gitState.staged.includes(f) && dir.children[f].type === 'file');

  if (gitState.staged.length > 0) {
    addOutput('');
    addOutput('要提交的更改:', 'info');
    for (const f of gitState.staged) {
      addOutputHTML(`  <span style="color:var(--green)">新文件:   ${f}</span>`, 'result');
    }
  }

  if (unstaged.length > 0) {
    addOutput('');
    addOutput('未跟踪的文件:', 'warning');
    for (const f of unstaged) {
      addOutput(`  ${f}`, 'result');
    }
    addOutput('');
    addOutput('使用 "git add <file>..." 包含要提交的内容', 'dim');
  }

  if (gitState.staged.length === 0 && unstaged.length === 0) {
    addOutput('nothing to commit, working tree clean', 'dim');
  }
}

function gitLog() {
  if (!gitState.initialized) {
    addOutput('fatal: 不是 Git 仓库', 'error');
    return;
  }

  if (gitState.commits.length === 0) {
    addOutput('尚无提交记录', 'dim');
    return;
  }

  const logs = [...gitState.commits].reverse();
  for (const commit of logs) {
    addOutputHTML(`<span style="color:var(--amber);font-weight:700">commit ${commit.hash}</span>`, 'git');
    addOutput(`Author: ${commit.author} <${commit.author}@sys0.local>`, 'dim');
    addOutput(`Date:   ${commit.date}`, 'dim');
    addOutput('');
    addOutput(`    ${commit.message}`, 'result');
    addOutput('');
  }
}

function gitDiff(args) {
  if (!gitState.initialized) {
    addOutput('fatal: 不是 Git 仓库', 'error');
    return;
  }

  if (gitState.staged.length === 0) {
    addOutput('无暂存的更改', 'dim');
    return;
  }

  addOutput('diff --git 暂存区更改:', 'git');
  for (const f of gitState.staged) {
    const file = getFile(f);
    if (file) {
      addOutput(`--- a/${f}`, 'error');
      addOutput(`+++ b/${f}`, 'ai');
      const lines = (file.content || '').split('\n');
      for (const line of lines.slice(0, 5)) {
        addOutput(`+${line}`, 'result');
      }
      if (lines.length > 5) {
        addOutput(`... (${lines.length - 5} more lines)`, 'dim');
      }
    }
  }
}

function gitBranch(args) {
  if (!gitState.initialized) {
    addOutput('fatal: 不是 Git 仓库', 'error');
    return;
  }

  if (args.length === 0) {
    // 列出分支
    for (const branch of gitState.branches) {
      if (branch === gitState.branch) {
        addOutput(`* ${branch}`, 'git');
      } else {
        addOutput(`  ${branch}`, 'result');
      }
    }
  } else {
    // 创建分支
    const newBranch = args[0];
    if (gitState.branches.includes(newBranch)) {
      addOutput(`fatal: 分支 '${newBranch}' 已存在`, 'error');
      return;
    }
    gitState.branches.push(newBranch);
    addOutput(`分支 '${newBranch}' 已创建 (基于 ${gitState.branch})`, 'git');
    saveState();
  }
}

function gitCheckout(args) {
  if (!gitState.initialized) {
    addOutput('fatal: 不是 Git 仓库', 'error');
    return;
  }

  if (args.length === 0) {
    addOutput('用法: git checkout <branch>', 'error');
    return;
  }

  const target = args[0];
  if (!gitState.branches.includes(target)) {
    addOutput(`error: 路径规范 '${target}' 未匹配任何已知分支`, 'error');
    return;
  }

  if (gitState.staged.length > 0) {
    addOutput('error: 有未提交的更改，请先提交或暂存', 'warning');
    return;
  }

  gitState.branch = target;
  addOutput(`已切换到分支 '${target}'`, 'git');
  saveState();
}

async function cmdReset(args) {
  if (!args.includes('--confirm')) {
    addOutput('[警告] 此操作将清除所有本地数据并重置终端到初始状态！', 'warning');

  }
  clearState();
  addOutput('[已清除本地存储数据]', 'system');
  addOutput('正在重置终端...', 'warning');

  // 重置所有状态到初始值
  fileSystem = JSON.parse(JSON.stringify(defaultFileSystem));
  commandHistory = [];
  historyIndex = -1;
  currentDir = '~';
  env = { USER: 'nexus', HOST: 'terminal', HOME: '~', SHELL: '/bin/nexus', LANG: 'zh_CN.UTF-8', TERM: 'xterm-256color', PATH: '/usr/local/bin:/usr/bin:/bin' };
  aliases = {};
  gitState = { initialized: false, branch: 'main', commits: [], staged: [], log: [] };
  editMode = false;
  editIndicator.classList.remove('active');
  inputEl = null;
  aiConversationHistory = [];

  terminal.innerHTML = '';
  showWelcome();
  createInputLine();
  addOutput('[终端已重置为初始状态]', 'system');
}

function clearTerminal() {
  terminal.innerHTML = '';

function cmdEcho(args, stdin = '') {
  const text = args.length > 0 ? args.join(' ') : stdin;

function cmdLs(args) {
  const targetPath = args[0] || currentDir;
  const dir = resolveDir(resolvePath(targetPath));
  if (!dir || dir.type !== 'dir') {
    addOutput(`ls: 无法访问 '${targetPath}': 不是目录`, 'error');
    return;
  }

  const showHidden = args.includes('-a') || args.includes('-la') || args.includes('-al');
  const showLong = args.includes('-l') || args.includes('-la') || args.includes('-al');
  const entries = Object.keys(dir.children);

  if (showLong) {
    addOutput(`总计 ${entries.length}`, 'dim');
    for (const name of entries) {
      if (!showHidden && name.startsWith('.')) continue;
      const entry = dir.children[name];
      const isDir = entry.type === 'dir';
      const perms = isDir ? 'drwxr-xr-x' : '-rw-r--r--';
      const size = isDir ? '4096' : (entry.content?.length || 0).toString().padStart(5);
      const dateStr = '6月  7 14:30';
      const colorName = isDir ? `<span style="color:var(--cyan);font-weight:600">${name}/</span>` : name.startsWith('.') ? `<span style="color:var(--green-dark)">${name}</span>` : `<span style="color:var(--green-dim)">${name}</span>`;
      addOutputHTML(`${perms}  1 ${env.USER.padEnd(8)} ${env.USER.padEnd(8)} ${size} ${dateStr}  ${colorName}`, 'result');
    }
  } else {
    let output = '';
    for (const name of entries) {
      if (!showHidden && name.startsWith('.')) continue;
      const entry = dir.children[name];
      const isDir = entry.type === 'dir';
      if (isDir) {
        output += `<span style="color:var(--cyan);font-weight:600">${name}/</span>  `;
      } else if (name.startsWith('.')) {
        output += `<span style="color:var(--green-dark)">${name}</span>  `;
      } else {
        output += `<span style="color:var(--green-dim)">${name}</span>  `;
      }
    }
    addOutputHTML(output || '(空目录)', 'result');
  }
}

function cmdCd(args) {
  if (!args[0] || args[0] === '~') {
    currentDir = '~';
    return;
  }

  const targetPath = resolvePath(args[0]);
  const dir = resolveDir(targetPath);

  if (!dir || dir.type !== 'dir') {
    addOutput(`cd: 没有此目录: ${args[0]}`, 'error');
    return;
  }

  currentDir = targetPath;
}

function cmdCat(args, stdin = '') {
  if (!args[0]) {
    if (stdin) {
      addOutput(stdin, 'result');
    } else {
      addOutput('cat: 缺少文件参数', 'error');
    }
    return;
  }

  const file = getFile(args[0]);
  if (!file) {
    addOutput(`cat: ${args[0]}: 文件不存在`, 'error');
    return;
  }
  if (file.type === 'dir') {
    addOutput(`cat: ${args[0]}: 是一个目录`, 'error');
    return;
  }
  addOutput(file.content || '(空文件)');
}

function cmdMkdir(args) {

  if (dir.children[args[0]]) {
    addOutput(`mkdir: 无法创建 '${args[0]}': 文件已存在`, 'error');
    return;
  }
  dir.children[args[0]] = { type: 'dir', children: {} };
  addOutput(`目录 '${args[0]}' 已创建`, 'dim');

}

function cmdTree(args) {
  const targetPath = args[0] || currentDir;
  const dir = resolveDir(resolvePath(targetPath));
  if (!dir || dir.type !== 'dir') {
    addOutput(`tree: '${targetPath}' 不是目录`, 'error');
    return;
  }

  addOutput(resolvePath(targetPath === '~' ? '~' : targetPath), 'info');
  let fileCount = 0, dirCount = 0;

  function drawTree(node, prefix, isLast) {
    const entries = Object.keys(node.children || {});
    entries.forEach((name, i) => {
      const last = i === entries.length - 1;
      const connector = last ? '└── ' : '├── ';
      const entry = node.children[name];
      const isDir = entry.type === 'dir';
      if (isDir) dirCount++; else fileCount++;

      const colorName = isDir
        ? `<span style="color:var(--cyan);font-weight:600">${name}/</span>`
        : `<span style="color:var(--green-dim)">${name}</span>`;
      addOutputHTML(`${prefix}${connector}${colorName}`, 'result');

      if (isDir) {
        const newPrefix = prefix + (last ? '    ' : '│   ');
        drawTree(entry, newPrefix, last);
      }
    });
  }

  drawTree(dir, '', true);
  addOutput('');
  addOutput(`${dirCount} 个目录, ${fileCount} 个文件`, 'dim');
}

function cmdCalc(args) {

    addOutput('calc: 用法 - calc <表达式>  例: calc 2+3*4', 'error');

  const expr = args.join(' ');
  try {
    if (!/^[\d\s+\-*/().%^]+$/.test(expr)) {
      addOutput('calc: 表达式包含非法字符', 'error');
      return;
    }
    const safeExpr = expr.replace(/\^/g, '**');
    const result = Function('"use strict"; return (' + safeExpr + ')')();
    addOutput(`${expr} = ${result}`, 'info');
  } catch {
    addOutput('calc: 无效表达式', 'error');
  }
}

async function cmdReboot() {
  addOutput('正在重启终端...', 'warning');
  await sleep(500);

  document.querySelector('.terminal-wrapper').classList.add('glitch');
  await sleep(300);
  document.querySelector('.terminal-wrapper').classList.remove('glitch');

  terminal.innerHTML = '';
  commandHistory = [];
  historyIndex = -1;
  currentDir = '~';
  editMode = false;
  editIndicator.classList.remove('active');
  inputEl = null;

  const newBoot = document.createElement('div');
  newBoot.id = 'boot-screen';
  newBoot.innerHTML = `
    <div class="boot-logo">NEXUS</div>
    <div class="boot-text" id="boot-text"></div>
    <div class="progress-bar"><div class="fill" id="boot-progress"></div></div>
  `;
  terminal.appendChild(newBoot);

  await sleep(300);
  const newBootText = document.getElementById('boot-text');
  const newBootProgress = document.getElementById('boot-progress');
  const newBootScreen = document.getElementById('boot-screen');

  for (let i = 0; i < bootSequence.length; i++) {
    const step = bootSequence[i];
    const line = document.createElement('div');
    line.className = 'line';
    if (step.text.includes('✓')) line.style.color = 'var(--green-dim)';
    else if (step.text.includes('>>>')) { line.style.color = 'var(--cyan)'; line.style.fontWeight = '600'; }
    else if (step.text.includes('[SEC]')) line.style.color = 'var(--amber)';
    line.textContent = step.text;
    newBootText.appendChild(line);
    await sleep(50);
    line.classList.add('visible');
    newBootProgress.style.width = `${((i + 1) / bootSequence.length) * 100}%`;
    if (step.delay) await sleep(step.delay);
  }

  await sleep(400);
  newBootScreen.style.transition = 'opacity 0.5s ease';
  newBootScreen.style.opacity = '0';
  await sleep(500);
  newBootScreen.remove();

  try {
    showWelcome();
  } catch (e) {
    console.warn('showWelcome 异常:', e);
  }

  try {
    createInputLine();
  } catch (e) {
    console.warn('createInputLine 异常:', e);
  }
}

function cmdExit() {
  addOutput('logout', 'dim');
  addOutput('连接已关闭。', 'warning');
  addOutput('');
  addOutput('（这是模拟终端，无法真正退出。输入任意命令继续使用）', 'dim');
}

// ═══════════════════════════════════════════
// Matrix 背景
// ═══════════════════════════════════════════

function initMatrixBg() {
  const canvas = document.getElementById('matrix-bg');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
  const fontSize = 14;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array(columns).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(10, 14, 20, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff9f';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 50);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
}

// ═══════════════════════════════════════════
// 全局事件
// ═══════════════════════════════════════════

document.addEventListener('click', (e) => {
  if (!e.target.closest('.autocomplete')) {
    hideAutocomplete();
  }
  if (inputEl && !e.target.closest('.autocomplete')) {
    inputEl.focus();
  }
});

// 终端区域点击时自动聚焦输入框
document.querySelector('.terminal-body').addEventListener('click', (e) => {
  if (!e.target.closest('input') && !e.target.closest('.autocomplete') && inputEl) {
    inputEl.focus();
  }
});

// 启动
initMatrixBg();
boot();
</script>
